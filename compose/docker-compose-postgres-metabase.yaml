version: "3.9"
services:
  postgres:
    image: postgres:latest
    container_name: postgres
    hostname: postgres
    ports:
      - 5433:5432
    environment:
      POSTGRES_DB: ${db_metabase_nm}    
      POSTGRES_USER: ${db_user_nm}
      POSTGRES_PASSWORD: ${db_password}
    networks:
      - metanet1
networks:
  metanet1:
    driver: bridge